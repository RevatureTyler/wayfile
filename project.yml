name: Wayfile
options:
  bundleIdPrefix: com.wayfile
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.wayfile.app
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Wayfile:
    type: application
    platform: iOS
    sources:
      - Wayfile
    info:
      path: Wayfile/Info.plist
      properties:
        CFBundleDisplayName: Wayfile
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: Wayfile uses your location while you record a drive so it can measure the distance.
        NSLocationAlwaysAndWhenInUseUsageDescription: Wayfile uses your location to keep measuring a drive when your screen is locked.
